---
- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform
    Greeting: "Good Evening"
    tagsMap:
      Project: Roboshop
      Course: DEVOPS
      name: ansible
  tasks:
  - name: Greeting

    ansible.builtin.debug:
      msg: "Hi Mahesh, {{ Greeting | default('Good Morning') }}"

  - name: Convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tagsMap | dict2list }}"
