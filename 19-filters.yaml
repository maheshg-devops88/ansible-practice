---
- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform
    myIP: 172.31.26.190
    Greeting: "Good Evening"
    tagsMap:
      Project: Roboshop
      Course: DEVOPS
      name: ansible
    tagsList: [ { "key": "name", "value": "ansible" }, { "key": "Project", "value": "Roboshop" }, { "key": "Course", "value": "DEVOPS" } ]

  tasks:
  - name: Greeting

    ansible.builtin.debug:
      msg: "Hi Mahesh, {{ Greeting | default('Good Morning') }}"

  - name: Convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"

  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tagsMap | dict2items }}"

  - name: convert list to Map
    ansible.builtin.debug:
      msg: "{{ tagsList | items2dict }}"

  - name: convert letter to upper
    ansible.builtin.debug:
      msg: "{{ topics | upper }}"

  - name: convert letter to lower
    ansible.builtin.debug:
      msg: "{{ Greeting | lower }}"

  - name: Get the IP address
    ansible.builtin.debug:
      msg: "Ansible control node ip is : {{ myIP }}"
    when: ansible.utils.ipv4
