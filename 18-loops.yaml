---
- name: installing packages
  hosts: web
  become: true
  tasks:
  - name: Install package
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    - { name: "mysql", state: "absent" }
    - { name: "telnet", state: "present" }
    - { name: "zip", state: "present" }
    - { name: "nginx", state: "absent" }
